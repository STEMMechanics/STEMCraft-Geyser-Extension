held-item-scale: 2.7

rotation:
  x: -20.0
  y: -135.0
  z: 0.0

offset:
  x: 0.25
  y: 0.575
  z: 0.75

# Bedrock held-item pivot compensation, multiplied by (1 - display scale)
# independently on each axis. Full-scale displays receive no correction.
scale-pivot-correction:
  x: -0.25
  y: -0.525
  z: -0.775

# Multipliers applied on top of held-item-scale.
block-overrides:
  minecraft:*chest:
    scale: 2.6
    x: -0.4
    y: 0.1
    z: 0.9
  minecraft:*_wall:
    x: -0.5
    y: -0.5
    z: 0.0
