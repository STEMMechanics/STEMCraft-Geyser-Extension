name: Feature request
description: Propose a new compatibility feature or improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to display or achieve, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected Java and Bedrock behavior, command or configuration surface.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Block displays
        - Item displays
        - Transformations and movement
        - Resource pack
        - Calibration and configuration
        - Commands
        - Documentation
        - Build and release tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds

  - type: dropdown
    id: implement
    attributes:
      label: Would you like to implement this?
      options:
        - I am hoping someone else picks it up
        - I would like to implement it
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include commands, NBT, screenshots, videos or related issues.
